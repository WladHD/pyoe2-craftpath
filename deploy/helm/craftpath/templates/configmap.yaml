apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "craftpath.fullname" . }}-config
  labels:
    {{- include "craftpath.labels" . | nindent 4 }}
data:
  REDIS_URL: {{ include "craftpath.redisUrl" . | quote }}
  POE2_LEAGUE_DEFAULT: {{ .Values.config.defaultLeague | quote }}
  JOB_TTL_SECS: {{ .Values.config.jobTtlSeconds | quote }}
  JOB_TIMEOUT_SECS: {{ .Values.config.jobTimeoutSeconds | quote }}
  MAX_RAM_LIMIT_BYTES: {{ .Values.config.maxRamLimitBytes | quote }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}
  BIND_ADDR: "0.0.0.0:8080"
  WORKER_HEALTH_ADDR: "0.0.0.0:8081"
  CACHE_DIR: "/cache"
