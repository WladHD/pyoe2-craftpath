{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "craftpath.fullname" . }}-mcp
  labels:
    {{- include "craftpath.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "craftpath.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "craftpath.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "craftpath.serviceAccountName" . }}
      containers:
        - name: mcp
          image: {{ include "craftpath.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["mcp", "--transport", "http"]
          envFrom:
            - configMapRef:
                name: {{ include "craftpath.fullname" . }}-config
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
{{- end }}
