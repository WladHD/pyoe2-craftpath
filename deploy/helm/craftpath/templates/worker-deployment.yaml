apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "craftpath.fullname" . }}-worker
  labels:
    {{- include "craftpath.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # replica count is managed by the HPA
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "craftpath.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "craftpath.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "craftpath.serviceAccountName" . }}
      containers:
        - name: worker
          image: {{ include "craftpath.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: {{ include "craftpath.fullname" . }}-config
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
          volumeMounts:
            - name: league-cache
              mountPath: /cache
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: league-cache
          emptyDir:
            sizeLimit: {{ .Values.worker.cacheSizeLimit }}
