syntax = "proto3";

package craftpath.v1;

// Mirrors craftpath_core::api::currency::CraftCurrencyEnum.
// Payload-carrying variants (DESECRATOR, ESSENCE) put their payload into the
// optional fields of CraftCurrency.
enum CraftCurrencyKind {
  CRAFT_CURRENCY_KIND_UNSPECIFIED = 0;

  // currencies
  CRAFT_CURRENCY_KIND_ORB_OF_TRANSMUTATION_NORMAL = 1;
  CRAFT_CURRENCY_KIND_ORB_OF_TRANSMUTATION_GREATER = 2;
  CRAFT_CURRENCY_KIND_ORB_OF_TRANSMUTATION_PERFECT = 3;
  CRAFT_CURRENCY_KIND_ORB_OF_AUGMENTATION_NORMAL = 4;
  CRAFT_CURRENCY_KIND_ORB_OF_AUGMENTATION_GREATER = 5;
  CRAFT_CURRENCY_KIND_ORB_OF_AUGMENTATION_PERFECT = 6;
  CRAFT_CURRENCY_KIND_REGAL_ORB_NORMAL = 7;
  CRAFT_CURRENCY_KIND_REGAL_ORB_GREATER = 8;
  CRAFT_CURRENCY_KIND_REGAL_ORB_PERFECT = 9;
  CRAFT_CURRENCY_KIND_EXALTED_ORB_NORMAL = 10;
  CRAFT_CURRENCY_KIND_EXALTED_ORB_GREATER = 11;
  CRAFT_CURRENCY_KIND_EXALTED_ORB_PERFECT = 12;
  CRAFT_CURRENCY_KIND_ORB_OF_ANNULMENT = 13;
  CRAFT_CURRENCY_KIND_CHAOS_ORB_NORMAL = 14;
  CRAFT_CURRENCY_KIND_CHAOS_ORB_GREATER = 15;
  CRAFT_CURRENCY_KIND_CHAOS_ORB_PERFECT = 16;
  CRAFT_CURRENCY_KIND_ARTIFICERS_ORB = 17;
  CRAFT_CURRENCY_KIND_VAAL_ORB = 18;
  CRAFT_CURRENCY_KIND_OMEN_OF_CORRUPTION = 19;
  CRAFT_CURRENCY_KIND_FRACTURING_ORB = 20;

  // desecration
  CRAFT_CURRENCY_KIND_DESECRATOR = 21;
  CRAFT_CURRENCY_KIND_ABYSSAL_ECHOES = 22;
  CRAFT_CURRENCY_KIND_THE_BLACKBLOODED = 23;
  CRAFT_CURRENCY_KIND_THE_SOVEREIGN = 24;
  CRAFT_CURRENCY_KIND_THE_LIEGE = 25;
  CRAFT_CURRENCY_KIND_DEXTRAL_NECROMANCY = 26;
  CRAFT_CURRENCY_KIND_SINISTRAL_NECROMANCY = 27;

  // omens
  CRAFT_CURRENCY_KIND_HOMOGENISING_CORONATION = 28;
  CRAFT_CURRENCY_KIND_HOMOGENISING_EXALTATION = 29;
  CRAFT_CURRENCY_KIND_DEXTRAL_EXALTATION = 30;
  CRAFT_CURRENCY_KIND_SINISTRAL_EXALTATION = 31;
  CRAFT_CURRENCY_KIND_DEXTRAL_ANNULMENT = 32;
  CRAFT_CURRENCY_KIND_SINISTRAL_ANNULMENT = 33;
  CRAFT_CURRENCY_KIND_DEXTRAL_ERASURE = 34;
  CRAFT_CURRENCY_KIND_SINISTRAL_ERASURE = 35;
  CRAFT_CURRENCY_KIND_WHITTLING = 36;

  // essences
  CRAFT_CURRENCY_KIND_ESSENCE = 37;
  CRAFT_CURRENCY_KIND_DEXTRAL_CRYSTALLISATION = 38;
  CRAFT_CURRENCY_KIND_SINISTRAL_CRYSTALLISATION = 39;
}

// Payload for CRAFT_CURRENCY_KIND_DESECRATOR.
message DesecratorPayload {
  uint32 base_item_id = 1;
  uint32 base_group_id = 2;
}

message CraftCurrency {
  CraftCurrencyKind kind = 1;
  // Set iff kind == CRAFT_CURRENCY_KIND_DESECRATOR.
  optional DesecratorPayload desecrator = 2;
  // Set iff kind == CRAFT_CURRENCY_KIND_ESSENCE (EssenceId, u16 in core).
  optional uint32 essence_id = 3;
  // Resolved in-game item name; populated by the server in results so that
  // clients do not need provider data. Ignored in requests.
  string display_name = 4;
}

// Set semantics: order irrelevant, server deduplicates.
message CraftCurrencyList {
  repeated CraftCurrency list = 1;
}
