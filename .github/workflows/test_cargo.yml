name: Run Cargo Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/test_cargo.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/test_cargo.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust and dependencies
        run: |
          # Install Rust
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env

          # Install required packages
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            git \
            ca-certificates \
            curl \
            jq
          sudo rm -rf /var/lib/apt/lists/*

      - name: Run tests (workspace, default features)
        run: cargo test --workspace --verbose

      - name: Run tests without python feature
        run: cargo test --workspace --no-default-features --verbose

      - name: Build python extension crate
        run: cargo build -p pyoe2-craftpath --verbose
