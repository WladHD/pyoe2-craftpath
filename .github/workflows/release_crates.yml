name: Release Crate

on:
    push:
        tags:
            - "*"
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        working-directory: backend

jobs:
    publish:
        name: Publish to crates.io
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust and dependencies
              run: |
                  # Install Rust
                  curl https://sh.rustup.rs -sSf | sh -s -- -y
                  source $HOME/.cargo/env

                  # Install required packages
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      pkg-config \
                      build-essential \
                      git \
                      ca-certificates \
                      curl \
                      jq
                  sudo rm -rf /var/lib/apt/lists/*

            - name: Build crates
              run: cargo build --release --verbose --workspace

            - name: Run tests
              run: cargo test --release --verbose --workspace

            # craftpath-core must be on crates.io before the crates that depend on it
            - name: Publish craftpath-core to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: cargo publish -p craftpath-core --verbose

            - name: Publish pyoe2-craftpath to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: cargo publish -p pyoe2-craftpath --verbose
