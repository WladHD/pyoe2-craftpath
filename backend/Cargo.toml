[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/WladHD/pyoe2-craftpath"
authors = ["Wladislaw Jerokin <wladhd@gmail.com>"]

[workspace.dependencies]
# internal crates
# version must stay in lockstep with [workspace.package] version - crates.io
# strips the path, so cargo publish -p pyoe2-craftpath needs a registry version
craftpath-core = { path = "crates/craftpath-core", version = "0.6.0" }
craftpath-proto = { path = "crates/craftpath-proto" }

# core
xxhash-rust = { version = "0.8.15", features = ["xxh32"] }
rustc-hash = "2.1.1"
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
num-integer = "0.1.46"
num-format = "0.4.4"
indicatif = "0.18.2"
ctrlc = { version = "3.5.1", features = ["termination"] }
humansize = { version = "2.1.3", features = ["no_alloc"] }
rayon = "1.11.0"
semver = { version = "1.0.27", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = { version = "0.9", features = ["vendored"] }

# python bindings
pyo3 = "0.27.1"
pyo3-stub-gen = "0.16.1"

# benches
criterion = "0.7"

# wire contract
prost = "0.14"
prost-build = "0.14"
pbjson = "0.9"
pbjson-build = "0.9"

# server
craftpath-server = { path = "crates/craftpath-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
base64 = "0.22"
flate2 = "1.1"
quick-xml = "0.37"
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1.0"
tokio-util = "0.7"

[profile.release]
lto = "thin"
